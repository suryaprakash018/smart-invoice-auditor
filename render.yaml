services:
  - type: web
    name: veritas-audit-engine
    env: python
    buildCommand: "pip install -r requirements.txt && python -m src.database.seed"
    startCommand: "uvicorn src.server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 10000
