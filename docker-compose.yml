version: '3.8'

services:
  # 1. PostgreSQL 16 Enterprise Database
  postgres:
    image: postgres:16-alpine
    container_name: veritas-postgres
    restart: always
    environment:
      POSTGRES_DB: veritas_compliance
      POSTGRES_USER: veritas_admin
      POSTGRES_PASSWORD: veritas_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritas_admin -d veritas_compliance"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7 Task Queue Broker & Result Backend
  redis:
    image: redis:7-alpine
    container_name: veritas-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Veritas AP Core Application
  veritas-ap:
    build: .
    container_name: veritas-ap-auditor
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://veritas_admin:veritas_secure_pass@postgres:5432/veritas_compliance
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
